<!doctype html><html><head><style>body{margin:0;background:#151918;color:#c9c9b9;font:15px monospace}main{display:grid;grid-template-columns:repeat(4,320px)}section{border:1px solid #333;padding:8px}h3{margin:0}canvas{width:300px;height:180px}</style></head><body><main></main><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/examples/jsm/loaders/GLTFLoader.js';import{MeshoptDecoder}from'three/examples/jsm/libs/meshopt_decoder.module.js';
const names=['m249','m14','p90','vector','g36','rpg7','mp7','m32','atv','motorcycle','spas12','ak47','helicopter'];window.assets={};window.errors=[];
const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder),r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});r.setSize(300,180);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.2;
for(const name of names){try{const model=(await loader.loadAsync('/models/'+(['atv','motorcycle','helicopter'].includes(name)?'vehicles':'weapons')+'/'+name+'.glb')).scene;const s=new THREE.Scene();s.add(new THREE.HemisphereLight(0xffffff,0x4a4940,3));const l=new THREE.DirectionalLight(0xffffff,5);l.position.set(2,5,2);s.add(l);const fill=new THREE.DirectionalLight(0xafcbdc,3);fill.position.set(-2,2,-3);s.add(fill);s.add(model);let bb=new THREE.Box3().setFromObject(model),size=bb.getSize(new THREE.Vector3()),c=bb.getCenter(new THREE.Vector3());model.position.sub(c);const length=Math.max(size.z,size.x,size.y),camera=new THREE.OrthographicCamera(-length*.65,length*.65,length*.39,-length*.39,.001,1000);camera.position.set(length*2.2,length*.5,length*.5);camera.lookAt(0,0,0);r.render(s,camera);const el=document.createElement('section');el.innerHTML='<h3>'+name+'</h3><img width="300" height="180" src="'+r.domElement.toDataURL()+'"/>';document.querySelector('main').append(el);window.assets[name]={size:size.toArray(),meshes:[]};model.traverse(o=>{if(o.isMesh)window.assets[name].meshes.push({name:o.name,size:new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3()).toArray()});});}catch(e){window.errors.push(name+': '+e.message)}}window.done=true;
</script></body></html>
