<!doctype html><html><head><title>Operator inspection</title><style>body{margin:0;background:#161b1e;color:#eee;font:14px system-ui}header{position:absolute;top:24px;left:24px;letter-spacing:3px}canvas{display:block}</style></head><body><header>OPERATOR RIG INSPECTION · STANDING / CROUCHED / MOVING</header><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import {SoldierPuppet} from '/src/game/Puppet.ts';import {WEAPONS} from '/src/game/WeaponDefs.ts';
const scene=new THREE.Scene();scene.background=new THREE.Color('#263039');const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.01,100);camera.position.set(5,2.4,8);camera.lookAt(0,1,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.6;document.body.append(renderer.domElement);

</script></body></html>
