<!doctype html><title>Local multiplayer load probe</title><script type="module">
import {init} from '@instantdb/core';
if(!['localhost','127.0.0.1'].includes(location.hostname))throw Error('Local test harness only');
window.probeJoin=async({key,name,suffix})=>{
 const r=await fetch('/api/lobby',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,name})});const d=await r.json();if(!r.ok)throw Error(d.error);
 const db=init({appId:'ec099d8e-0cbc-4742-87f6-e01fac862c5c'});await db.auth.signInWithToken(d.token);
 const presence={id:d.id,name,joined:Date.now(),ready:true,loadout:0,mic:false,owner:false,preparedRound:''};
 const room=db.joinRoom('sable',d.roomId+'-'+suffix+'-match-v4',{initialPresence:presence});
 const state={id:d.id,room,db,presence,seq:0,world:null,messages:0};window.probe=state;
 const receive=world=>{if(!world)return;state.world=world;if(world.phase==='loading'&&presence.preparedRound!==world.round){presence.preparedRound=world.round;room.publishPresence(presence);}};
 room.subscribePresence({},s=>{for(const p of Object.values(s.peers||{}))if(p.world)receive(p.world);});
 room.subscribeTopic('wire',data=>{if(data.kind==='world'){state.messages++;receive(data.world);}});
 state.timer=setInterval(()=>{const w=state.world,p=w?.entities.find(p=>p.id===d.id);if(w?.phase==='playing'&&p?.alive)room.publishTopic('wire',{kind:'pose',round:w.round,seq:++state.seq,pose:{...p,speed:0}});},80);
 return d.id;
};
</script>
